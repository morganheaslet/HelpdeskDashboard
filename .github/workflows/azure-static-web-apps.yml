name: Deploy Helpdesk Report (Static Web App + Function App)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_frontend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy static web app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/static-web-app"
          api_location: ""
          output_location: ""
          skip_api_build: true

  deploy_function_app:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy the data-pulling Function App
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately no local `pip install` step here. Installing
      # dependencies on this runner (ubuntu-latest, a newer glibc) and
      # shipping those prebuilt wheels straight into the Function App
      # produces exactly this failure at runtime:
      #   ImportError: ... GLIBC_2.33' not found (required by .../cryptography/.../_rust.abi3.so)
      # because the Linux Function App container's glibc is older than the
      # one these wheels were built against. Instead, ship only the source
      # (requirements.txt included) and let Azure's own Oryx build system
      # install dependencies remotely, inside a container that matches the
      # actual runtime — set once via `SCM_DO_BUILD_DURING_DEPLOYMENT=true`
      # on the Function App (see README step 6). Do not reintroduce a local
      # pip install / --target step here.
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: "th2-helpdesk-functions"
          package: "function-app"
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request (tear down preview environment)
    steps:
      - name: Close PR
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
